name: KKR RPPI Project Deploy (Build on GitHub & Load on Server)

on:
  push:
    branches: [ "production" ]

concurrency:
  group: deploy-kkr-rppi
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build image Docker di runner GitHub
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: kkr-rppi-project:latest
          outputs: type=docker,dest=kkr-rppi-project.tar

      # 2. Transfer file tar & docker-compose ke server VPS
      - name: Copy files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_SSH || 22 }}
          source: "kkr-rppi-project.tar,docker-compose.yml"
          target: "/www/wwwroot/kkr-rppi-project"
          rm: false

      # 3. Load image dan jalankan container di server VPS
      - name: Load Image and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_SSH || 22 }}
          script: |
            set -e
            cd /www/wwwroot/kkr-rppi-project
            
            # Pastikan file .env ada (minimal kosong) agar docker compose tidak error
            touch .env
            
            # Load image dari file tar yang ditransfer
            docker load -i kkr-rppi-project.tar
            
            # Jalankan container menggunakan compose
            docker compose up -d
            
            # Bersihkan file tar untuk menghemat ruang disk server
            rm -f kkr-rppi-project.tar
            
            # Bersihkan image lama yang tak terpakai
            docker image prune -f
            docker compose ps
